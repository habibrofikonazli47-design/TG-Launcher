name: Verify Minecraft Launch Repair

on:
  push:
    branches: [fix/minecraft-all-versions-crash]
    paths:
      - ".github/workflows/verify-minecraft-all-versions.yml"
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"

permissions:
  contents: read

jobs:
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Compile Android debug variant
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
