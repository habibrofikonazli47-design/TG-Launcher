name: Verify MobileGlues Renderer

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/verify-mobileglues-renderer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-mobileglues-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TG Launcher
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build Android debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify MobileGlues native ABI packaging
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -l "$APK" | tee /tmp/tg-apk-libs.txt
          grep -q 'lib/arm64-v8a/libmobileglues.so' /tmp/tg-apk-libs.txt
          if grep -q 'lib/armeabi-v7a/libmobileglues.so' /tmp/tg-apk-libs.txt; then
            echo "Unexpected 32-bit MobileGlues binary found." >&2
            exit 1
          fi
          echo "MobileGlues ABI packaging verified: arm64-v8a only."
