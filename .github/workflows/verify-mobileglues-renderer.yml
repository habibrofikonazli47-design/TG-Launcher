name: Verify MobileGlues Renderer and Build Release APK

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/verify-mobileglues-renderer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-mobileglues-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TG Launcher
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build Android debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Build Android release APK in the same run
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify MobileGlues native ABI packaging in both APKs
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          for APK in "$DEBUG_APK" "$RELEASE_APK"; do
            test -s "$APK"
            echo "Checking $APK"
            unzip -l "$APK" | tee /tmp/tg-apk-libs.txt
            grep -q 'lib/arm64-v8a/libmobileglues.so' /tmp/tg-apk-libs.txt
            if grep -q 'lib/armeabi-v7a/libmobileglues.so' /tmp/tg-apk-libs.txt; then
              echo "Unexpected 32-bit MobileGlues binary found in $APK." >&2
              exit 1
            fi
          done
          echo "MobileGlues ABI packaging verified in debug and release APKs: arm64-v8a only."

      - name: Upload debug and release APKs
        uses: actions/upload-artifact@v4
        with:
          name: TG-Launcher-MobileGlues-debug-and-release
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/output-metadata.json
          if-no-files-found: error
          retention-days: 30
