name: Build TG Launcher

# Release builds use the persistent TG Launcher signing key from repository secrets.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-tg-launcher.yml"
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
  workflow_dispatch:

concurrency:
  group: tg-launcher-android-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TG Launcher
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify TG Launcher project metadata
        run: echo "Building the TG Launcher source repository directly; no external launcher source is imported."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set monotonic TG Launcher build number
        shell: bash
        run: |
          TG_BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 80))
          echo "TG_BUILD_NUMBER=$TG_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "TG_VERSION_CODE=$((TG_BUILD_NUMBER + 17))" >> "$GITHUB_ENV"
          echo "TG_VERSION_NAME=1.1.6-tg${TG_BUILD_NUMBER}" >> "$GITHUB_ENV"

      - name: Configure persistent APK signing key
        id: signing
        shell: bash
        env:
          TG_SIGNING_KEYSTORE_BASE64: ${{ secrets.TG_SIGNING_KEYSTORE_BASE64 }}
          TG_SIGNING_STORE_PASSWORD: ${{ secrets.TG_SIGNING_STORE_PASSWORD }}
          TG_SIGNING_KEY_ALIAS: ${{ secrets.TG_SIGNING_KEY_ALIAS }}
          TG_SIGNING_KEY_PASSWORD: ${{ secrets.TG_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${TG_SIGNING_KEYSTORE_BASE64}" && -n "${TG_SIGNING_STORE_PASSWORD}" && -n "${TG_SIGNING_KEY_ALIAS}" && -n "${TG_SIGNING_KEY_PASSWORD}" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/tg-launcher-release.jks"
            printf '%s' "$TG_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "TG_SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "TG_SIGNING_STORE_PASSWORD=$TG_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "TG_SIGNING_KEY_ALIAS=$TG_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "TG_SIGNING_KEY_PASSWORD=$TG_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "TG_SIGNING_READY=true" >> "$GITHUB_ENV"
            echo "Persistent release signing is configured."
          else
            echo "TG_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Persistent signing secrets are not configured; this build will remain a CI artifact and will NOT be published as an APK update."
          fi

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease -PTG_VERSION_CODE="$TG_VERSION_CODE" -PTG_VERSION_NAME="$TG_VERSION_NAME"

      - name: Verify APK package, signature, and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/TG-Launcher-v1.1.6-tg${TG_BUILD_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"

          # Re-sign the temporary CI build explicitly. Android 7+ devices,
          # including Android 15, verify the APK Signature Scheme v2/v3.
          if [[ "$TG_SIGNING_READY" != "true" ]]; then
            mkdir -p "$HOME/.android"
            if [[ ! -s "$HOME/.android/debug.keystore" ]]; then
              keytool -genkeypair -v \
                -keystore "$HOME/.android/debug.keystore" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$HOME/.android/debug.keystore" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$APK"
          fi

          # Verify v1 from API 18: SHA-256 JAR signatures are supported from API 18,
          # and this app's actual minSdk is 26. Android 7+ uses v2/v3.
          SIGNATURE_REPORT="$("$BUILD_TOOLS/apksigner" verify --min-sdk-version 18 --verbose --print-certs "$APK")"
          printf '%s\\n' "$SIGNATURE_REPORT"
          grep -q "Verified using v1 scheme (JAR signing): true" <<< "$SIGNATURE_REPORT"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" <<< "$SIGNATURE_REPORT"
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" <<< "$SIGNATURE_REPORT"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/tg-badging.txt
          grep -q "package: name='com.tg.launcher'" /tmp/tg-badging.txt
          grep -q "application-label:'TG Launcher'" /tmp/tg-badging.txt
          grep -q "native-code: 'arm64-v8a'" /tmp/tg-badging.txt
          grep -q "platformBuildVersionCode='37'" /tmp/tg-badging.txt
          grep -q "targetSdkVersion:'35'" /tmp/tg-badging.txt
          unzip -tq "$APK"
          sha256sum "$APK"
          echo "APK validation passed."

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tg-launcher-${{ env.TG_VERSION_NAME }}
          name: TG Launcher ${{ env.TG_VERSION_NAME }}
          draft: false
          prerelease: ${{ env.TG_SIGNING_READY != 'true' }}
          make_latest: ${{ env.TG_SIGNING_READY == 'true' }}
          body: |
            Automated TG Launcher APK build.
            If this release is marked as a prerelease, it uses temporary CI signing and is for testing only.
            Do not install over an existing TG Launcher unless its signing certificate matches.
          files: app/build/outputs/apk/release/TG-Launcher-v1.1.6-tg${{ env.TG_BUILD_NUMBER }}.apk

      - name: Upload TG Launcher APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG-Launcher-release-verified
          path: app/build/outputs/apk/release/TG-Launcher-v1.1.6-tg${{ env.TG_BUILD_NUMBER }}.apk
          if-no-files-found: error
          retention-days: 30
