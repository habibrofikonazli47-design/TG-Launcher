name: Build TG Launcher

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-nux-source.yml"
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TG Launcher
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify TG Launcher project metadata
        run: echo "Building the TG Launcher source repository directly; no external launcher source is imported."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Verify APK package, signature, and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/TG-Launcher-v1.1.6-tg${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/tg-badging.txt
          grep -q "package: name='com.tg.launcher'" /tmp/tg-badging.txt
          grep -q "application-label:'TG Launcher'" /tmp/tg-badging.txt
          grep -q "native-code: 'arm64-v8a'" /tmp/tg-badging.txt
          grep -q "platformBuildVersionCode='37'" /tmp/tg-badging.txt
          grep -q "targetSdkVersion:'35'" /tmp/tg-badging.txt
          unzip -tq "$APK"
          sha256sum "$APK"
          echo "APK validation passed."

      - name: Upload TG Launcher APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG-Launcher-release-verified
          path: app/build/outputs/apk/release/TG-Launcher-v1.1.6-tg${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.6-tg${{ github.run_number }}
          name: TG Launcher v1.1.6-tg${{ github.run_number }}
          body: |
            TG Launcher release build.
            Download the APK asset below; no ZIP extraction is required.
          files: |
            app/build/outputs/apk/release/TG-Launcher-v1.1.6-tg${{ github.run_number }}.apk
            app/build/outputs/apk/release/output-metadata.json
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
