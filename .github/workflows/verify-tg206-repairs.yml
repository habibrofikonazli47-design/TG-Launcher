name: Verify TG209 install compatibility

on:
  push:
    branches: [fix/tg206-feature-integration]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
      - ".github/workflows/verify-tg206-repairs.yml"

permissions:
  contents: write

concurrency:
  group: tg206-feature-repairs
  cancel-in-progress: true

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Configure TG Launcher release signing
        shell: bash
        env:
          TG_SIGNING_KEYSTORE_BASE64: ${{ secrets.TG_SIGNING_KEYSTORE_BASE64 }}
          TG_SIGNING_STORE_PASSWORD: ${{ secrets.TG_SIGNING_STORE_PASSWORD }}
          TG_SIGNING_KEY_ALIAS: ${{ secrets.TG_SIGNING_KEY_ALIAS }}
          TG_SIGNING_KEY_PASSWORD: ${{ secrets.TG_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TG_SIGNING_KEYSTORE_BASE64"
          test -n "$TG_SIGNING_STORE_PASSWORD"
          test -n "$TG_SIGNING_KEY_ALIAS"
          test -n "$TG_SIGNING_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/tg-launcher-release.jks"
          printf '%s' "$TG_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "TG_SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "TG_SIGNING_STORE_PASSWORD=$TG_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TG_SIGNING_KEY_ALIAS=$TG_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TG_SIGNING_KEY_PASSWORD=$TG_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          TG_VERSION_CODE: "272"
          TG_VERSION_NAME: "1.1.6-tg209"
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Verify package, signing identity, and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          # Re-sign with the SAME permanent TG release key and explicitly enable
          # all three schemes. AGP previously emitted v2-only APKs despite the
          # Gradle v1 flag, which can be rejected by some OEM installers.
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$TG_SIGNING_STORE_FILE" \
            --ks-key-alias "$TG_SIGNING_KEY_ALIAS" \
            --ks-pass "env:TG_SIGNING_STORE_PASSWORD" \
            --key-pass "env:TG_SIGNING_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$APK"
          "$BUILD_TOOLS/apksigner" verify --min-sdk-version 18 --verbose --print-certs "$APK" | tee /tmp/tg-signature.txt
          grep -q "Verified using v1 scheme (JAR signing): true" /tmp/tg-signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/tg-signature.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/tg-signature.txt
          grep -q "V3.0 Signer: certificate SHA-256 digest: e5aa76841020b79e40f8612021d262f53afdb3d918b3dbc4df97afca1af3b73f" /tmp/tg-signature.txt
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          if [ ! -x "$APKANALYZER" ]; then
            APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          fi
          test -n "$APKANALYZER"
          test -x "$APKANALYZER"
          echo "APK application id: $("$APKANALYZER" manifest application-id "$APK")"
          echo "APK version code: $("$APKANALYZER" manifest version-code "$APK")"
          echo "APK version name: $("$APKANALYZER" manifest version-name "$APK")"
          echo "APK target SDK: $("$APKANALYZER" manifest target-sdk "$APK")"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/tg-badging.txt
          grep -q "package: name='com.tg.launcher'" /tmp/tg-badging.txt
          test "$("$APKANALYZER" manifest application-id "$APK")" = "com.tg.launcher"
          test "$("$APKANALYZER" manifest version-code "$APK")" = "272"
          test "$("$APKANALYZER" manifest version-name "$APK")" = "1.1.6-tg209"
          test "$("$APKANALYZER" manifest target-sdk "$APK")" = "35"
          unzip -Z1 "$APK" | grep -Eq '^lib/arm64-v8a/.*[.]so$'
          unzip -tq "$APK"
          sha256sum "$APK"

      - name: Prepare direct APK and update metadata
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk TG-Launcher-v1.1.6-tg209.apk
          cp app/build/outputs/apk/release/output-metadata.json output-metadata.json
          test -s TG-Launcher-v1.1.6-tg209.apk
          test -s output-metadata.json

      - name: Publish direct TG209 APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tg-launcher-1.1.6-tg209
          name: TG Launcher 1.1.6 TG209
          body: |
            TG209 built from the existing TG206 codebase.
            Package: com.tg.launcher
            Version code: 272
            Signing identity verified against TG206.
            Install this APK over TG206; keep the existing app installed.
          files: |
            TG-Launcher-v1.1.6-tg209.apk
            output-metadata.json
          make_latest: true

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: TG-Launcher-tg209-feature-validation
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
