name: Verify TG Launcher Smart Updater

on:
  push:
    branches:
      - feature/smart-updater-current
    paths:
      - "app/**"
      - ".github/workflows/verify-smart-updater.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/verify-smart-updater.yml"

permissions:
  contents: read

jobs:
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Compile release Kotlin sources
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:compileReleaseKotlin
