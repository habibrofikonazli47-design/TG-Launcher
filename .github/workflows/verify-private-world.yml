name: Verify TG Private World Feature

on:
  push:
    branches: [feature/private-world-invites]
    paths:
      - "app/**"
      - "admin/**"
      - "supabase/**"
      - "docs/**"
      - ".github/workflows/verify-private-world.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tg-private-world-feature-check
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Compile Android debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Build Admin Panel
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
  supabase-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check TG Social Edge Function
        run: deno check supabase/functions/tg-social-api/index.ts
