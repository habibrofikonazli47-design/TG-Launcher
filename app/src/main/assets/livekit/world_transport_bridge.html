<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TG Private World Transport</title>
  <script src="livekit-client.umd.min.js"></script>
</head>
<body>
<script>
  let worldRoom = null;
  const WORLD_TOPIC = "tg-world-tcp-v1";

  function toBase64(bytes) {
    let binary = "";
    const chunkSize = 0x8000;
    for (let offset = 0; offset < bytes.length; offset += chunkSize) {
      binary += String.fromCharCode.apply(null, bytes.subarray(offset, offset + chunkSize));
    }
    return btoa(binary);
  }

  function fromBase64(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  async function connectWorldTransport(serverUrl, token, sessionId) {
    try {
      if (worldRoom) await worldRoom.disconnect();
      if (typeof LivekitClient === "undefined") throw new Error("LiveKit SDK tidak tersedia");

      const room = new LivekitClient.Room({
        adaptiveStream: false,
        dynacast: false,
        disconnectOnPageLeave: false
      });

      room.on(LivekitClient.RoomEvent.DataReceived, (payload, participant, kind, topic) => {
        if (topic !== WORLD_TOPIC || !participant) return;
        try {
          window.AndroidWorldBridge.onDataPacket(toBase64(payload), participant.identity);
        } catch (error) {
          console.error("[TGWorld] failed to deliver packet to Android", error);
        }
      });

      room.on(LivekitClient.RoomEvent.Disconnected, () => {
        if (window.AndroidWorldBridge) window.AndroidWorldBridge.onWorldDisconnected();
      });

      await room.connect(serverUrl, token);
      worldRoom = room;
      window.AndroidWorldBridge.onWorldConnected(sessionId, room.localParticipant.identity);
      return true;
    } catch (error) {
      const message = (error && error.message) || String(error);
      if (window.AndroidWorldBridge) window.AndroidWorldBridge.onWorldError(message);
      return false;
    }
  }

  async function sendWorldPacket(base64Payload, targetIdentity) {
    if (!worldRoom || !worldRoom.localParticipant) throw new Error("Transport dunia belum terhubung");
    const payload = fromBase64(base64Payload);
    const options = { reliable: true, topic: WORLD_TOPIC };
    if (targetIdentity) options.destinationIdentities = [targetIdentity];
    await worldRoom.localParticipant.publishData(payload, options);
  }

  async function disconnectWorldTransport() {
    if (worldRoom) {
      try { await worldRoom.disconnect(); } catch (_) {}
      worldRoom = null;
    }
  }
</script>
</body>
</html>
